<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #bfe9ff;
  }

  svg {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.2s linear infinite;
  }

  .pedal {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1s linear infinite;
  }

  .pelican {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: bob 1.2s ease-in-out infinite;
  }

  .wing {
    transform-box: fill-box;
    transform-origin: 20% 25%;
    animation: flap 1.2s ease-in-out infinite;
  }

  .leg-back {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: legBack 1s ease-in-out infinite;
  }

  .leg-front {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: legFront 1s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes flap {
    0%, 100% { transform: rotate(2deg); }
    50% { transform: rotate(-8deg); }
  }

  @keyframes legBack {
    0%, 100% { transform: rotate(22deg); }
    50% { transform: rotate(-25deg); }
  }

  @keyframes legFront {
    0%, 100% { transform: rotate(-25deg); }
    50% { transform: rotate(22deg); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="650" fill="#bfe9ff"/>
  <circle cx="820" cy="105" r="48" fill="#fff1a8" opacity=".85"/>

  <g fill="#ffffff" opacity=".8">
    <ellipse cx="150" cy="120" rx="75" ry="25"/>
    <ellipse cx="205" cy="115" rx="55" ry="22"/>
    <ellipse cx="760" cy="205" rx="80" ry="25"/>
    <ellipse cx="820" cy="200" rx="55" ry="22"/>
  </g>

  <path d="M0 500 Q180 470 350 500 T700 495 T1000 500 L1000 650 L0 650Z"
        fill="#83c96b"/>
  <path d="M0 545 Q220 520 430 545 T1000 540"
        fill="none" stroke="#5da84d" stroke-width="8" opacity=".55"/>

  <!-- 自行车 -->
  <g stroke="#243746" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <g class="wheel">
      <circle cx="300" cy="455" r="78" fill="#d9f5ff"/>
      <circle cx="300" cy="455" r="8" fill="#243746"/>
      <path d="M300 377V533 M222 455H378 M245 400L355 510 M355 400L245 510"/>
    </g>

    <g class="wheel">
      <circle cx="690" cy="455" r="78" fill="#d9f5ff"/>
      <circle cx="690" cy="455" r="8" fill="#243746"/>
      <path d="M690 377V533 M612 455H768 M635 400L745 510 M745 400L635 510"/>
    </g>

    <path d="M300 455 L420 350 L560 455 L300 455 L490 455 L420 350"/>
    <path d="M560 455 L690 455"/>
    <path d="M560 455 L575 335"/>
    <path d="M575 335 L630 320"/>
    <path d="M575 335 L550 310"/>
    <path d="M405 350 L390 320"/>
    <path d="M365 320 H415"/>
  </g>

  <!-- 脚踏板 -->
  <g class="pedal" stroke="#243746" stroke-width="7" stroke-linecap="round">
    <circle cx="490" cy="455" r="17" fill="#ffcc4d"/>
    <path d="M490 455 L520 425 M520 425 H545"/>
    <path d="M490 455 L460 485 M460 485 H435"/>
  </g>

  <!-- 鹈鹕 -->
  <g class="pelican">
    <!-- 身体 -->
    <ellipse cx="485" cy="270" rx="112" ry="125" fill="#f4f1e8" stroke="#243746" stroke-width="7"/>
    <ellipse cx="475" cy="300" rx="80" ry="92" fill="#dedbd0"/>

    <!-- 尾羽 -->
    <path d="M390 330 Q330 355 350 390 Q405 370 440 335Z"
          fill="#c9c7bd" stroke="#243746" stroke-width="7"/>

    <!-- 脖子 -->
    <path d="M445 205 Q430 135 475 100 Q520 75 555 120 L540 230Z"
          fill="#f4f1e8" stroke="#243746" stroke-width="7"/>

    <!-- 头部 -->
    <ellipse cx="525" cy="105" rx="75" ry="65" fill="#f4f1e8" stroke="#243746" stroke-width="7"/>
    <circle cx="550" cy="88" r="8" fill="#243746"/>

    <!-- 长喙与喉囊 -->
    <path d="M570 112 Q720 112 790 145 Q700 178 570 145 Q550 133 570 112Z"
          fill="#f3a83b" stroke="#243746" stroke-width="7"/>
    <path d="M575 145 Q645 180 710 160 Q680 225 605 205 Q570 185 575 145Z"
          fill="#ef8e35" stroke="#243746" stroke-width="7"/>
    <path d="M690 142 Q750 142 790 145" stroke="#b56b27" stroke-width="4"/>

    <!-- 翅膀 -->
    <path class="wing"
          d="M430 205 Q355 225 365 315 Q380 370 455 385 Q475 330 465 270Z"
          fill="#b9c0bd" stroke="#243746" stroke-width="7"/>
    <path d="M390 280 Q420 300 455 315 M385 320 Q420 340 450 350"
          fill="none" stroke="#8e9998" stroke-width="5"/>

    <!-- 后腿 -->
    <g class="leg-back" stroke="#d98228" stroke-width="10" stroke-linecap="round">
      <path d="M450 370 L430 425"/>
      <path d="M430 425 L465 455"/>
      <path d="M465 455 H495"/>
    </g>

    <!-- 前腿 -->
    <g class="leg-front" stroke="#d98228" stroke-width="10" stroke-linecap="round">
      <path d="M520 370 L550 425"/>
      <path d="M550 425 L520 455"/>
      <path d="M520 455 H490"/>
    </g>

    <!-- 脚爪 -->
    <path d="M462 455 l-12 10 M475 455 l-8 12 M520 455 l12 10 M507 455 l8 12"
          stroke="#d98228" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 地面小花 -->
  <g stroke="#3d8f42" stroke-width="4" stroke-linecap="round">
    <path d="M120 535 v-25 M115 520 l-12 -10 M120 525 l13 -12"/>
    <path d="M850 535 v-30 M845 515 l-12 -10 M850 520 l14 -12"/>
  </g>
  <g fill="#ffcf4d" stroke="#d98d2b" stroke-width="3">
    <circle cx="120" cy="505" r="8"/>
    <circle cx="850" cy="500" r="8"/>
  </g>
</svg>
</body>
</html>
