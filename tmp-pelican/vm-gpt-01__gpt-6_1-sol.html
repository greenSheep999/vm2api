<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #bfe9f3;
  }

  svg {
    display: block;
    width: 100vw;
    height: 100vh;
    min-height: 520px;
    font-family: Arial, sans-serif;
  }

  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.2s linear infinite;
  }

  .pedals {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.8s linear infinite;
  }

  .pelican-body {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: bob 0.8s ease-in-out infinite;
  }

  .wing {
    transform-box: fill-box;
    transform-origin: 255px 210px;
    animation: wingFlap 1.1s ease-in-out infinite;
  }

  .leg-left {
    transform-box: fill-box;
    transform-origin: 270px 300px;
    animation: pedalLeft 0.8s ease-in-out infinite;
  }

  .leg-right {
    transform-box: fill-box;
    transform-origin: 300px 300px;
    animation: pedalRight 0.8s ease-in-out infinite;
  }

  .head {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: headBob 0.8s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes headBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(-1deg); }
  }

  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-8deg); }
  }

  @keyframes pedalLeft {
    0%, 100% { transform: rotate(18deg); }
    50% { transform: rotate(-20deg); }
  }

  @keyframes pedalRight {
    0%, 100% { transform: rotate(-20deg); }
    50% { transform: rotate(18deg); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 760 520" role="img" aria-label="一只鹈鹕骑自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcecf7"/>
      <stop offset="1" stop-color="#e8f8ef"/>
    </linearGradient>
    <linearGradient id="bodyColor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#d9e3df"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c35b"/>
      <stop offset="1" stop-color="#df754b"/>
    </linearGradient>
  </defs>

  <rect width="760" height="520" fill="url(#sky)"/>

  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".65">
    <path d="M75 100 Q105 78 135 100 Q165 77 198 101"/>
    <path d="M535 105 Q565 83 595 105 Q625 82 658 106"/>
  </g>

  <path d="M0 426 Q170 397 320 425 T760 420 L760 520 L0 520Z"
        fill="#8ed38b"/>
  <path d="M0 445 Q180 419 350 443 T760 438"
        fill="none" stroke="#65b96f" stroke-width="5" opacity=".65"/>

  <!-- 自行车 -->
  <g stroke="#263f52" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g class="wheel" fill="#e8f5f2">
      <circle cx="170" cy="390" r="62"/>
      <circle cx="170" cy="390" r="8" fill="#263f52"/>
      <path d="M170 328V452 M108 390H232 M126 346L214 434 M214 346L126 434"
            stroke-width="2" opacity=".65"/>
    </g>

    <g class="wheel" fill="#e8f5f2">
      <circle cx="430" cy="390" r="62"/>
      <circle cx="430" cy="390" r="8" fill="#263f52"/>
      <path d="M430 328V452 M368 390H492 M386 346L474 434 M474 346L386 434"
            stroke-width="2" opacity=".65"/>
    </g>

    <path d="M170 390 L258 310 L350 390 L170 390 L300 390 L430 390
             M258 310 L295 310 L350 390"
          fill="none" stroke="#d04f4f" stroke-width="10"/>
    <path d="M258 310 L245 286 M231 286 H263"
          fill="none" stroke="#263f52" stroke-width="7"/>
    <path d="M430 390 L444 276 M444 276 L421 259 M444 276 L468 260"
          fill="none" stroke="#263f52" stroke-width="7"/>
    <path d="M418 257 Q444 244 470 257" fill="none" stroke="#263f52" stroke-width="8"/>
    <circle cx="300" cy="390" r="15" fill="#d04f4f"/>

    <g class="pedals" fill="none">
      <path d="M300 390 L323 366 M300 390 L276 414"/>
      <path d="M318 361 h18 M267 419 h18"/>
    </g>
  </g>

  <!-- 鹈鹕 -->
  <g class="pelican-body">
    <!-- 身体 -->
    <ellipse cx="274" cy="245" rx="75" ry="83" fill="url(#bodyColor)"
             stroke="#364e58" stroke-width="5"/>
    <ellipse cx="285" cy="263" rx="52" ry="57" fill="#f8faf3" opacity=".8"/>

    <!-- 尾羽 -->
    <path d="M213 277 Q168 292 185 326 Q220 310 242 286Z"
          fill="#b8c9c8" stroke="#364e58" stroke-width="5"/>
    <path d="M214 286 Q181 314 208 337 Q232 314 245 288Z"
          fill="#dce8e3" stroke="#364e58" stroke-width="4"/>

    <!-- 脖子 -->
    <path d="M282 197 Q287 157 306 132 Q328 105 355 122
             Q337 158 341 203 L321 234 L286 224Z"
          fill="#f4f7ed" stroke="#364e58" stroke-width="5"/>

    <!-- 翅膀 -->
    <g class="wing">
      <path d="M247 190 Q201 205 205 263 Q210 304 253 315
               Q279 286 286 236 Q282 204 247 190Z"
            fill="#c3d2d0" stroke="#364e58" stroke-width="5"/>
      <path d="M224 222 Q248 242 263 276 M218 245 Q242 261 255 292"
            fill="none" stroke="#8ea8a8" stroke-width="4"/>
      <path d="M232 204 Q258 216 273 244" fill="none"
            stroke="#edf4ed" stroke-width="8"/>
    </g>

    <!-- 腿 -->
    <g class="leg-left" fill="none" stroke="#d58543" stroke-width="9"
       stroke-linecap="round">
      <path d="M263 292 L274 344 L300 381"/>
      <path d="M300 381 l-18 7 M300 381 l15 8"/>
    </g>
    <g class="leg-right" fill="none" stroke="#c8733c" stroke-width="9"
       stroke-linecap="round">
      <path d="M300 291 L286 345 L300 381"/>
      <path d="M300 381 l-17 8 M300 381 l17 5"/>
    </g>

    <!-- 头部 -->
    <g class="head">
      <circle cx="347" cy="105" r="45" fill="#f5f8ee"
              stroke="#364e58" stroke-width="5"/>
      <path d="M313 84 Q333 48 370 65 Q390 77 386 106
               Q373 135 342 133 Q319 120 313 84Z"
            fill="#e0e9df"/>
      <circle cx="365" cy="91" r="7" fill="#1e2930"/>
      <circle cx="367" cy="88" r="2.5" fill="#ffffff"/>
      <!-- 长喙与喉囊 -->
      <path d="M326 111 Q277 103 214 119 Q268 136 329 132
               Q348 127 351 115Z"
            fill="url(#beak)" stroke="#364e58" stroke-width="5"/>
      <path d="M326 119 Q278 127 238 132 Q261 174 303 161
               Q331 153 339 130Z"
            fill="#e98b62" stroke="#364e58" stroke-width="5"/>
      <path d="M239 132 Q277 143 330 128" fill="none"
            stroke="#bd5d4d" stroke-width="3"/>
      <path d="M236 120 Q270 121 306 119" fill="none"
            stroke="#fff0a1" stroke-width="4"/>
    </g>
  </g>

  <path d="M95 458 Q380 447 520 459 Q625 469 700 454"
        fill="none" stroke="#4e9b62" stroke-width="5" opacity=".55"/>
</svg>
</body>
</html>
