<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #bfe9f4;
  }
  svg {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .outline {
    stroke: #253746;
    stroke-width: 5;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .wheel {
    fill: none;
    stroke: #253746;
    stroke-width: 7;
  }
  .spoke {
    stroke: #7196a4;
    stroke-width: 2;
  }
  .bob {
    animation: bob 1.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .wing {
    animation: wing 1.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 55% 35%;
  }
  .cloud {
    animation: drift 18s linear infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes wing {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(7deg); }
  }
  @keyframes drift {
    from { transform: translateX(-30px); }
    to { transform: translateX(90px); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 900 600" role="img" aria-label="一只鹈鹕骑自行车的二维动画">
  <rect width="900" height="600" fill="#bfe9f4"/>
  <circle cx="770" cy="105" r="48" fill="#ffe89a" opacity=".9"/>

  <g class="cloud" fill="#fff" opacity=".7">
    <path d="M90 125c12-28 52-31 69-7 22-20 62-5 60 25H75c0-9 5-15 15-18z"/>
    <path d="M620 170c10-23 43-26 58-6 20-17 51-4 51 22h-130c0-8 7-14 21-16z"/>
  </g>

  <path d="M0 455 Q180 420 360 450 T720 445 T900 455 V600H0Z" fill="#8dcc7b"/>
  <path d="M0 492 Q210 470 430 495 T900 490" fill="none" stroke="#5eae68" stroke-width="6"/>

  <!-- 自行车 -->
  <g>
    <g>
      <circle cx="230" cy="405" r="82" class="wheel"/>
      <circle cx="230" cy="405" r="8" fill="#253746"/>
      <g>
        <path d="M230 405L230 323M230 405L230 487M230 405L148 405M230 405L312 405
                 M230 405L172 347M230 405L288 463M230 405L172 463M230 405L288 347" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 230 405" to="360 230 405" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>

    <g>
      <circle cx="650" cy="405" r="82" class="wheel"/>
      <circle cx="650" cy="405" r="8" fill="#253746"/>
      <g>
        <path d="M650 405L650 323M650 405L650 487M650 405L568 405M650 405L732 405
                 M650 405L592 347M650 405L708 463M650 405L592 463M650 405L708 347" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 650 405" to="360 650 405" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>

    <path d="M230 405L330 300L475 405L230 405M330 300L650 405M475 405L520 300L650 405"
          fill="none" class="outline" stroke="#d85e45"/>
    <path d="M316 300L330 272M300 270h48" fill="none" class="outline"/>
    <path d="M520 300L536 266L570 254" fill="none" class="outline"/>
    <path d="M550 255l28 9-10 13-28-8z" fill="#d85e45" class="outline"/>
    <path d="M475 405h-35M475 405l28 19" fill="none" class="outline"/>
    <g>
      <circle cx="475" cy="405" r="13" fill="#f5b942" class="outline"/>
      <path d="M475 405l-22-22M475 405l25 22" class="outline" fill="none"/>
      <rect x="438" y="375" width="25" height="9" rx="4" fill="#253746"/>
      <rect x="500" y="423" width="25" height="9" rx="4" fill="#253746"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 475 405" to="360 475 405" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 鹈鹕 -->
  <g class="bob">
    <!-- 身体 -->
    <ellipse cx="380" cy="245" rx="112" ry="78" fill="#f5f2e9" class="outline"/>
    <path d="M300 244c-20 28-12 70 31 85 34 12 62-4 72-29-47 7-76-12-103-56z"
          fill="#d8e0df" class="outline"/>

    <!-- 翅膀 -->
    <g class="wing">
      <path d="M347 204c45-27 97-10 112 26 10 26-14 66-53 68-34 2-60-28-59-94z"
            fill="#dce6e5" class="outline"/>
      <path d="M365 222c25 21 45 42 62 66M385 214c18 25 30 45 39 69M405 218c10 21 17 40 21 59"
            fill="none" stroke="#9caeb2" stroke-width="4"/>
    </g>

    <!-- 长脖子 -->
    <path d="M407 210c8-37 7-71-13-101-12-18-4-43 19-48 27-6 43 16 35 39-10 29 18 69 30 101z"
          fill="#f5f2e9" class="outline"/>
    <path d="M421 62c15 17 11 40 4 55" fill="none" stroke="#c8d5d4" stroke-width="6"/>

    <!-- 头部 -->
    <ellipse cx="444" cy="52" rx="45" ry="38" fill="#f5f2e9" class="outline"/>
    <circle cx="460" cy="43" r="7" fill="#253746"/>
    <circle cx="462" cy="41" r="2.5" fill="#fff"/>

    <!-- 长喙与喉囊 -->
    <path d="M430 65L575 83Q587 86 575 96L438 91Z" fill="#f2a643" class="outline"/>
    <path d="M439 91Q497 91 575 96 548 155 485 128 451 113 439 91z"
          fill="#f08b55" class="outline"/>
    <path d="M454 101q48 28 91 3" fill="none" stroke="#c75e4b" stroke-width="4"/>

    <!-- 腿 -->
    <g fill="none" class="outline">
      <g>
        <path d="M354 299L337 363L300 393" stroke="#d88a36" stroke-width="10"/>
        <path d="M300 393q-22 5-32-2M300 393q-13 15-28 17M300 393q4 15 18 20"
              stroke="#d88a36" stroke-width="6"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-16 354 299;16 354 299;-16 354 299" dur="1.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M414 302L438 360L493 389" stroke="#d88a36" stroke-width="10"/>
        <path d="M493 389q21 6 30-3M493 389q14 14 28 17M493 389q-3 15-17 20"
              stroke="#d88a36" stroke-width="6"/>
        <animateTransform attributeName="transform" type="rotate"
          values="16 414 302;-16 414 302;16 414 302" dur="1.5s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <path d="M100 535H800" stroke="#4e9d5b" stroke-width="8" stroke-linecap="round"/>
  <g fill="#4e9d5b">
    <path d="M135 535q-15-32 3-50 18 24 3 50z"/>
    <path d="M750 535q-15-32 3-50 18 24 3 50z"/>
  </g>
</svg>
</body>
</html>
